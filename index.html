function saveCloudConfig(){let u=document.getElementById('sbUrl').value.trim().replace(/\/$/,''),a=document.getElementById('sbAnon').value.trim();if(u&&!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(u))return notice('Enter a valid Supabase project URL');state.settings.supabaseUrl=u;state.settings.supabaseAnon=a;save();notice('Cloud configuration saved locally')}
async function testSupabase(){
 const el=document.getElementById('sbDiagnostic');
 const url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');
 const key=document.getElementById('sbAnon').value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){el.textContent='Invalid URL format. Copy the project URL, not the /rest/v1/ endpoint.';return;}
 el.textContent='Testing '+url+' …';
 try{
   const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});
   const body=await r.text();
   if(r.ok){el.textContent='Connection successful (HTTP '+r.status+'). You can now create an account.';}
   else {el.textContent='Server reached (HTTP '+r.status+'). Check that the publishable key belongs to this exact project. '+body.slice(0,140);}
 }catch(e){el.textContent='Cannot reach '+url+' — '+e.message+'. Check the exact hostname in Supabase and whether your network or DNS blocks it.';}
}

function deleteWorkout(id){if(!confirm('Delete this workout?'))return;state.workouts=state.workouts.filter(w=>w.id!==id);closeModal();save()}
function completeWorkout(id){let w=state.workouts.find(w=>w.id===id);w.status='done';save()}function uncompleteWorkout(id){let w=state.workouts.find(w=>w.id===id);w.status='planned';w.matchId=null;save()}
function notesWorkout(id){let w=state.workouts.find(x=>x.id===id);openModal(`<h2>${esc(w.name)} — notes</h2><div class="field"><label>Session RPE (1–10)</label><input type="number" id="nRpe" min="1" max="10" value="${esc(w.rpe??'')}"></div><div class="field" style="margin-top:12px"><label>Notes</label><textarea id="nNote">${esc(w.note||'')}</textarea></div><div class="row" style="margin-top:12px">${b('Save notes',`saveNotes('${id}')`)}${b('Cancel','closeModal()','alt')}</div>`)}
function saveNotes(id){let w=state.workouts.find(x=>x.id===id);w.note=document.getElementById('nNote').value;w.rpe=document.getElementById('nRpe').value||null;closeModal();save()}
function editBlock(id){let x=state.blocks.find(b=>b.id===id)||{id:'',name:'',sport:'Running',start:today(),end:add(today(),90)};openModal(`<h2>${id?'Edit':'New'} training block</h2><div class="formgrid"><div class="field span2"><label>Name</label><input id="bName" value="${esc(x.name)}"></div><div class="field"><label>Sport</label><select id="bSport">${['HYROX','Running','Triathlon','Cycling','Swimming','Strength','Multi-sport'].map(s=>`<option ${x.sport===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Start</label><input type="date" id="bStart" value="${esc(x.start)}"></div><div class="field"><label>End</label><input type="date" id="bEnd" value="${esc(x.end)}"></div></div><div class="row" style="margin-top:12px">${b('Save block',`storeBlock('${id||''}')`)}${b('Cancel','closeModal()','alt')}</div>`)}
function storeBlock(id){let name=document.getElementById('bName').value.trim();if(!name)return notice('Enter block name');let x=state.blocks.find(b=>b.id===id);if(!x){x={id:uid()};state.blocks.push(x)}Object.assign(x,{name,sport:document.getElementById('bSport').value,start:document.getElementById('bStart').value,end:document.getElementById('bEnd').value});closeModal();save()}
function activateBlock(id){state.activeBlock=id;save()}
function editGoal(id){let x=state.goals.find(g=>g.id===id)||{id:'',name:'',date:today(),sport:'Running',target:'',block:state.activeBlock};openModal(`<h2>${id?'Edit':'New'} race goal</h2><div class="formgrid"><div class="field span2"><label>Event</label><input id="gName" value="${esc(x.name)}"></div><div class="field"><label>Date</label><input type="date" id="gDate" value="${esc(x.date)}"></div><div class="field"><label>Sport</label><select id="gSport">${['Running','HYROX','Triathlon','Cycling','Swimming','Other'].map(s=>`<option ${x.sport===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field span2"><label>Target</label><input id="gTarget" value="${esc(x.target)}"></div></div><div class="row" style="margin-top:12px">${b('Save goal',`storeGoal('${id||''}')`)}${id?b('Delete',`deleteGoal('${id}')`,'alt'):''}${b('Cancel','closeModal()','alt')}</div>`)}
function storeGoal(id){let name=document.getElementById('gName').value.trim();if(!name)return notice('Enter event name');let x=state.goals.find(g=>g.id===id);if(!x){x={id:uid(),block:state.activeBlock};state.goals.push(x)}Object.assign(x,{name,date:document.getElementById('gDate').value,sport:document.getElementById('gSport').value,target:document.getElementById('gTarget').value});closeModal();save()}
function deleteGoal(id){if(!confirm('Delete race goal?'))return;state.goals=state.goals.filter(g=>g.id!==id);closeModal();save()}
function suggestMatches(){let ignored=state.matches||{};let out=[];for(let a of activities()){let ds=String(a.date).slice(0,10);for(let w of workouts()){if(w.date!==ds||w.matchId||w.status==='skipped'||ignored[w.id+'|'+a.id])continue;let compatible=isRun(a)?['Running','HYROX'].includes(w.sport):/strength/i.test(a.type)?['Strength','HYROX'].includes(w.sport):String(a.type).toLowerCase().includes(w.sport.toLowerCase());if(compatible&&!state.workouts.some(x=>String(x.matchId)===String(a.id)))out.push({w,a})}}return out}
function confirmMatch(wid,aid){let w=state.workouts.find(w=>w.id===wid);if(state.workouts.some(x=>x.id!==wid&&String(x.matchId)===String(aid)))return notice('Activity already linked');w.matchId=aid;w.status='done';save();notice('Garmin workout matched')}
function ignoreMatch(wid,aid){state.matches[wid+'|'+aid]=true;save()}
async function fetchGarmin(){let key=document.getElementById('garminKey')?.value.trim()||state.settings.garminKey;if(!key)return notice('Enter dashboard read key');state.settings.garminKey=key;localStorage.setItem('av-training-v2',JSON.stringify(state));notice('Contacting Garmin Worker…');try{let r=await fetch(GARMIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});let data=await r.json();if(!r.ok||data.error)throw Error(data.error||'HTTP '+r.status);if(!Array.isArray(data.activities))throw Error('Unexpected activity response');let old=new Map(state.activities.map(a=>[String(a.id),a]));for(let a of data.activities){if(!a.id||!/^[a-zA-Z0-9_-]+$/.test(String(a.id)))continue;let d=typeof a.date==='string'?a.date:(a.date?new Date(a.date).toISOString():'');if(d.slice(0,10)<START)continue;old.set(String(a.id),{...a,date:d})}state.activities=[...old.values()];state.settings.lastGarminSync=new Date().toISOString();save();notice('Garmin loaded: '+data.activities.length+' records')}catch(e){notice('Garmin connection failed: '+e.message)}}
function exportBackup(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='av-training-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importBackup(input){let f=input.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!Array.isArray(s.workouts)||!Array.isArray(s.blocks))throw Error('Not a valid AV backup');if(!confirm('Replace local data with this backup?'))return;state=s;for(let k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];save();notice('Backup imported')}catch(e){notice('Import failed: '+e.message)}}
function sbHeaders(){return {'apikey':state.settings.supabaseAnon,'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
function cloudPayload(){let s=JSON.parse(JSON.stringify(state));s.settings={...s.settings,garminKey:'',supabaseAnon:'',supabaseUrl:''};return s}
async function cloudSave(retry=true){if(!token||!userId)return;let r=await fetch(state.settings.supabaseUrl+'/rest/v1/av_training_data?on_conflict=user_id',{method:'POST',headers:{...sbHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:userId,training_data:cloudPayload(),updated_at:new Date().toISOString()})});if(r.status===401&&retry&&await refreshSession())return cloudSave(false);if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,100))}
async function cloudLoad(retry=true){let r=await fetch(state.settings.supabaseUrl+'/rest/v1/av_training_data?user_id=eq.'+encodeURIComponent(userId)+'&select=training_data',{headers:sbHeaders()});if(r.status===401&&retry&&await refreshSession())return cloudLoad(false);if(!r.ok)throw Error('Cloud read HTTP '+r.status);let rows=await r.json();if(rows.length&&rows[0].training_data){let settings=state.settings;state=rows[0].training_data;state.settings={...settings,...state.settings,garminKey:settings.garminKey};for(let k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];localStorage.setItem('av-training-v2',JSON.stringify(state));render()}else await cloudSave()}
function sbConfig(){return state.settings.supabaseUrl&&state.settings.supabaseAnon}
let authRefreshBusy=null;
async function refreshSession(){let rt=sessionStorage.getItem('av-refresh');if(!rt||!sbConfig())return false;if(authRefreshBusy)return authRefreshBusy;authRefreshBusy=(async()=>{try{let r=await fetch(state.settings.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:state.settings.supabaseAnon,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok)throw Error('Session expired');let d=await r.json();token=d.access_token;userId=d.user?.id||userId;sessionStorage.setItem('av-token',token);sessionStorage.setItem('av-user',userId);if(d.refresh_token)sessionStorage.setItem('av-refresh',d.refresh_token);render();return true}catch(e){token='';userId='';sessionStorage.removeItem('av-token');sessionStorage.removeItem('av-user');sessionStorage.removeItem('av-refresh');render();notice('Session expired. Please sign in again.');return false}finally{authRefreshBusy=null}})();return authRefreshBusy}
async function auth(action){const emailInput=document.getElementById('sbEmail')?.value.trim(),passwordInput=document.getElementById('sbPass')?.value;const cloudUrl=document.getElementById('sbUrl')?.value.trim().replace(/\/$/,''),cloudAnon=document.getElementById('sbAnon')?.value.trim();state.settings.supabaseUrl=cloudUrl;state.settings.supabaseAnon=cloudAnon;localStorage.setItem('av-training-v2',JSON.stringify(state));if(!sbConfig())return notice('Configure Supabase URL and publishable key first');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cloudUrl))return notice('Invalid Supabase URL. Check project hostname.');let email=emailInput,password=passwordInput;if(!email||!password)return notice('Enter email and password');try{let r=await fetch(state.settings.supabaseUrl+'/auth/v1/'+action,{method:'POST',headers:{'apikey':state.settings.supabaseAnon,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Authentication failed');if(!d.access_token){notice('Account created. Confirm email, then sign in.');return}token=d.access_token;userId=d.user.id;sessionStorage.setItem('av-token',token);sessionStorage.setItem('av-user',userId);if(d.refresh_token)sessionStorage.setItem('av-refresh',d.refresh_token);await cloudLoad();render();notice('Signed in; cloud data ready')}catch(e){notice(e.message)}}
function signIn(){auth('v1/token?grant_type=password'.replace('v1/',''))}function signUp(){auth('v1/signup'.replace('v1/',''))}function signOut(){token='';userId='';sessionStorage.removeItem('av-token');sessionStorage.removeItem('av-user');sessionStorage.removeItem('av-refresh');render();notice('Signed out')}
// Preserve access to current Garmin activities while opening the app, if key is already saved.
render();if(token&&sessionStorage.getItem('av-refresh'))refreshSession().then(ok=>{if(ok)cloudLoad().catch(e=>notice('Cloud load failed: '+e.message))});if(state.settings.garminKey){fetch(GARMIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:state.settings.garminKey})}).then(async r=>{let d=await r.json();if(!r.ok||!Array.isArray(d.activities))return;let map=new Map(state.activities.map(a=>[String(a.id),a]));d.activities.forEach(a=>{if(a.id&&/^[a-zA-Z0-9_-]+$/.test(String(a.id))&&String(a.date).slice(0,10)>=START)map.set(String(a.id),a)});state.activities=[...map.values()];state.settings.lastGarminSync=new Date().toISOString();save()}).catch(()=>{})}
</script></body></html>
