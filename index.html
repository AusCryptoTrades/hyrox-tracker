.card{background:#191c20;border-color:#30363b}

function mergeGarminPayload(data){if(!Array.isArray(data.activities))throw Error('Unexpected activity response');let old=new Map(state.activities.map(a=>[String(a.id),a]));for(let a of data.activities){if(!a.id||!/^[a-zA-Z0-9_-]+$/.test(String(a.id)))continue;let d=typeof a.date==='string'?a.date:(a.date?new Date(a.date).toISOString():'');if(d.slice(0,10)<START)continue;old.set(String(a.id),{...a,date:d})}state.activities=[...old.values()];let raw=Array.isArray(data.recovery)?data.recovery:Array.isArray(data.recoveryDays)?data.recoveryDays:Array.isArray(data.dailyRecovery)?data.dailyRecovery:Array.isArray(data.wellness)?data.wellness:[];if(raw.length){let days=new Map(recoveryRecords().map(r=>[String(r.date||r.day||r.calendarDate).slice(0,10),r]));for(let r of raw){let d=String(r.date||r.day||r.calendarDate||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))days.set(d,{...days.get(d),...r,date:d})}state.recoveryDays=[...days.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date)))}state.settings.lastGarminSync=new Date().toISOString()}

function cloudSave(){
 if(!token||!userId||!state.settings.supabaseUrl||!state.settings.supabaseAnon)return Promise.reject(Error('Cloud is not configured'));
 const owner=userId,url=state.settings.supabaseUrl,anon=state.settings.supabaseAnon,payload=cloudPayload(),stamp=new Date().toISOString();
 avCloudPending++;avCloudError='';avCloudIndicator();
 const job=async()=>{if(owner!==userId||!token)throw Error('Session changed before save');let headers={'apikey':anon,'Authorization':'Bearer '+token,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'};let r=await fetch(url+'/rest/v1/av_training_data?on_conflict=user_id',{method:'POST',headers,body:JSON.stringify({user_id:owner,training_data:payload,updated_at:stamp})});if(r.status===401&&await refreshSession()){headers.Authorization='Bearer '+token;r=await fetch(url+'/rest/v1/av_training_data?on_conflict=user_id',{method:'POST',headers,body:JSON.stringify({user_id:owner,training_data:payload,updated_at:stamp})})}if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,120));localStorage.setItem('av-cloud-confirmed-'+owner,stamp)};
 const result=avCloudQueue.catch(()=>{}).then(job);avCloudQueue=result.catch(()=>{});result.then(()=>{avCloudPending--;avCloudIndicator()},e=>{avCloudPending--;avCloudError=e.message;avCloudIndicator()});return result;
}

function v46ChooseDays(available, count, preferred, start, weeks){
 const days=[...new Set(available.map(Number))].sort((a,b)=>a-b);
 const end=add(start,weeks*7-1);
 const busy=state.workouts.filter(w=>w.date>=start&&w.date<=end&&w.status!=='skipped'&&v456Visible(w.block));
 const datesByDay=Array.from({length:7},()=>[]);
 for(let k=0;k<weeks*7;k++){let dt=add(start,k);if(dt>end)break;datesByDay[(date(dt).getDay()+6)%7].push(dt)}
 const hard=w=>/interval|threshold|tempo|speed|compromised|race|hard/i.test((w.name||'')+' '+(w.detail||''));
 let best=null, bestScore=Infinity;
 function visit(index,chosen){
  if(chosen.length===count){
   const picked=new Set(chosen);let score=0;
   for(const d of chosen)for(const dt of datesByDay[d]){
    const same=busy.filter(w=>w.date===dt);
    score+=same.length*14+same.filter(hard).length*8;
    const prev=busy.filter(w=>w.date===add(dt,-1)&&hard(w));
    const next=busy.filter(w=>w.date===add(dt,1)&&hard(w));
    score+=(prev.length+next.length)*2;
   }
   // Avoid unnecessarily clustering new sessions, but allow consecutive days if needed.
   for(const d of chosen)if(picked.has((d+1)%7))score+=3;
   if(days.includes(preferred)&&!picked.has(preferred))score+=5;
   if(score<bestScore){bestScore=score;best=chosen.slice()}
   return;
  }
  if(index>=days.length||chosen.length+days.length-index<count)return;
  visit(index+1,[...chosen,days[index]]);visit(index+1,chosen);
 }
 visit(0,[]);return (best||days.slice(0,count)).sort((a,b)=>a-b);
}

#app .sport-tile.selected,#app .sport-tile:focus-visible{border:2px solid #b8ff3b!important;background:#293b19!important;box-shadow:inset 0 0 0 1px #b8ff3b!important}
#app .sport-tile.selected strong{color:#b8ff3b!important}
#app .mile-v31-sport-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin:0 auto 7px;color:#b8ff3b}
#app .mile-v31-sport-icon svg{width:35px;height:35px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app .mile-v31-zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
#app .mile-v31-zones .v44-zone{margin:0}
#app .mile-v31-hr>summary{cursor:pointer;font-weight:800;padding:12px 0;color:#b8ff3b}
#app .mile-v31-hr>summary::marker{color:#b8ff3b}
#app .mile-v31-profile-hidden{display:none!important}
#app .mile-v31-compact{font-size:11px!important;padding:6px 9px!important;min-height:32px!important}
#app .mile-v31-compact-sessions{margin-top:12px}
#app .mile-v31-compact-sessions summary{cursor:pointer}
</style>
<script id="mile-v31-fixes">
(function(){
 const previousRender=render;
 const previousSettings=settings;
 const sportSvgs={
 Running:'<circle cx="17" cy="4.5" r="2"/><path d="m12 10 4-3 4 3 2 1M16 7l-3 7-5 2m5-2 4 4-1 4M13 14l-4-3-5 3"/>',
 HYROX:'<circle cx="12" cy="4" r="2"/><path d="m12 7-2 5 3 4m-3-4-4 4m7 0 3 5M4 11v7M7 9v11M17 9v11M20 11v7M7 14h10"/>',
 Swimming:'<circle cx="15" cy="6" r="2"/><path d="m4 15 6-5 6 4 4-2M2 19q3-3 6 0t6 0t6 0t4 0M2 22q3-3 6 0t6 0t6 0t4 0"/>',
 Cycling:'<circle cx="5.5" cy="17.5" r="4"/><circle cx="18.5" cy="17.5" r="4"/><path d="m5.5 17.5 5-9 4 9h4m-8-9h-3m5-3h4m-2 3-3 9"/>'
 };
 function makeHidden(id,val){return '<input class="mile-v31-profile-hidden" type="hidden" id="'+id+'" value="'+esc(val??'')+'">'}
 // Preserve v451SaveProfile's expected input IDs in both settings views.
 function profileParts(){
  const t=document.createElement('template');t.innerHTML=v451ProfileCard();
  const card=t.content.querySelector('section');const grid=card.querySelector('.v451-zone-grid');
  const heading=[...card.querySelectorAll('h3')].find(x=>/Custom heart-rate zones/i.test(x.textContent));
  const profileGrid=card.querySelector('.formgrid');
  return {card,grid,heading,profileGrid};
 }
 settings=function(){
  if(mileV3SettingsTab!=='zones'){
   let html=previousSettings();
   if(mileV3SettingsTab==='profile'){
    const t=document.createElement('template');t.innerHTML=html;
    const grid=t.content.querySelector('.v451-zone-grid');
    if(grid){
      const card=grid.closest('section');
      const heading=[...card.querySelectorAll('h3')].find(x=>/Custom heart-rate zones/i.test(x.textContent));
      if(heading){let sibling=heading.nextElementSibling;heading.remove();if(sibling?.matches('p'))sibling.remove()}
      grid.remove();
      const ranges=v451Ranges();
      card.insertAdjacentHTML('beforeend',ranges.map((r,i)=>makeHidden('v451Min'+i,r.min)+makeHidden('v451Max'+i,r.max)).join(''));
      const reset=[...card.querySelectorAll('button')].find(x=>/Calculate zones/i.test(x.textContent));if(reset)reset.remove();
    }
    html=t.innerHTML;
   }
   return html;
  }
  const p=v45Profile(),{card,profileGrid}=profileParts();
  if(profileGrid)profileGrid.remove();
  const h2=card.querySelector('h2');if(h2)h2.textContent='Custom HR Zones';
  const firstP=card.querySelector('p');if(firstP)firstP.textContent='Edit your five custom heart-rate zones. Save your changes below.';
  card.insertAdjacentHTML('beforeend',
    makeHidden('v45MaxHR',p.maxHR||v44MaxHR()||'')+
    makeHidden('v45LTHR',p.lthr||'')+
    makeHidden('v45FiveK',p.fiveK||'')+
    makeHidden('v45Threshold',p.threshold||'')+
    makeHidden('v45Swim',p.swim||'')+
    makeHidden('v45FTP',p.ftp||''));
  const save=[...card.querySelectorAll('button')].find(x=>/Save athlete profile/i.test(x.textContent));if(save)save.textContent='Save HR Zones';
  return '<div class="mile-v3-settings-menu">'+[['profile','Athlete Profile'],['zones','HR Zones'],['connections','Connections / Restore']].map(([id,name])=>'<button class="'+(mileV3SettingsTab===id?'active':'')+'" onclick="mileV3SetSettingsTab(\''+id+'\')">'+name+'</button>').join('')+'</div><div class="grid">'+card.outerHTML+'</div>';
 };
 render=function(){
  previousRender();
  if(!v4Ready)return;
  const app=document.getElementById('app');if(!app)return;
  const subtitle=document.getElementById('subtitle');
  if(subtitle)subtitle.textContent='RUNNING · HYBRID · ENDURANCE  ·  '+new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  if(page==='dashboard'){
   const glance=app.querySelector('.mile-insights'),todayCard=app.querySelector('.v3-today');
   if(glance&&todayCard)todayCard.parentNode.insertBefore(glance,todayCard);
  }
  if(page==='calendar'){
   // Source uses <details class="av-hr-collapse">, not an h2, so V3's h2 matcher missed it.
   app.querySelectorAll('details.av-hr-collapse').forEach(el=>{
    const ranges=v451Ranges();
    el.className='card full mile-v31-hr';
    el.innerHTML='<summary>HR Zones - Tap to view</summary><div class="mile-v31-zones">'+ranges.map((z,i)=>'<div class="v44-zone"><strong>Z'+(i+1)+' · '+esc(v451ZoneNames[i])+'</strong><p>'+z.min+'–'+z.max+' bpm</p></div>').join('')+'</div>';
   });
   app.querySelectorAll('h3').forEach(h=>{
    if(!/^(All )?planned sessions\s*\(/i.test(h.textContent))return;
    const list=h.nextElementSibling;
    if(!list?.classList.contains('list'))return;
    const d=document.createElement('details');d.className='mile-v3-details mile-v31-compact-sessions';
    const sum=document.createElement('summary');sum.textContent=h.textContent.replace(/^All /,'');
    const body=document.createElement('div');body.className='mile-v3-detail-content';body.appendChild(list);
    d.append(sum,body);h.replaceWith(d);
   });
   app.querySelectorAll('button').forEach(btn=>{
    if(/Manage Calendar Programs/i.test(btn.textContent))btn.classList.add('mile-v31-compact');
   });
  }
  if(page==='builder'){
   app.querySelectorAll('.sport-tile').forEach(tile=>{
    const sport=[...Object.keys(sportSvgs)].find(x=>tile.querySelector('strong')?.textContent.trim()===x);
    if(!sport)return;
    [...tile.children].forEach(ch=>{if(ch.tagName!=='STRONG')ch.remove()});
    tile.insertAdjacentHTML('afterbegin','<span class="mile-v31-sport-icon"><svg viewBox="0 0 24 24" aria-hidden="true">'+sportSvgs[sport]+'</svg></span>');
   });
   app.querySelectorAll('input[type="date"]').forEach(el=>{el.style.width='100%';el.style.minWidth='0'});
   app.querySelectorAll('button').forEach(btn=>{
    if(/^(Continue|Generate Program)/i.test(btn.textContent.trim())){btn.classList.remove('alt','ghost');btn.style.setProperty('background','#b8ff3b','important');btn.style.setProperty('color','#111','important')}
   });
  }
  if(page==='goals'){
   app.querySelectorAll('h2,h3').forEach(h=>{if(/race goals/i.test(h.textContent))h.textContent=h.textContent.replace(/race goals/i,'Planned Events')});
  }
  const version=document.getElementById('av474Version');if(version)version.textContent='MILE. · V3.1';
 };
})();
</script>
</body></html>
