<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>HYROX Training HQ</title><style>:root{color-scheme:dark;--bg:#0b1220;--card:#18253a;--line:#30415a;--text:#f0f6ff;--muted:#a8bbd2;--green:#65e5a4;--blue:#76b9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{padding:22px 18px 14px;background:#101b2c;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:2px;font-size:22px}.sub{color:var(--muted);font-size:12px;margin-top:3px}.wrap{max-width:850px;margin:auto;padding:16px 14px 96px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:12px}.eyebrow{color:var(--muted);font-size:11px;letter-spacing:1px;font-weight:700;text-transform:uppercase}.big{font-size:23px;font-weight:800;margin:7px 0}.muted{color:var(--muted)}.pill{display:inline-block;background:#234e42;color:#b0ffda;border-radius:30px;padding:6px 10px;font-size:12px}.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metrics .card{margin:0;min-height:118px}.number{font-size:23px;font-weight:800;margin:8px 0}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101b2c;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}.tabs button{flex:1;background:none;border:0;color:#a8bbd2;padding:14px 2px;font-size:12px}.tabs button.active{color:var(--green);font-weight:800}button{cursor:pointer}button.action{background:var(--green);color:#062016;border:0;border-radius:10px;padding:12px 15px;font-weight:800}button.secondary{background:#283d55;color:white;border:1px solid #40556d;border-radius:10px;padding:10px}input,select,textarea{background:#0e1b2e;border:1px solid #50617a;border-radius:9px;color:white;padding:11px;width:100%;font:inherit}label{display:block;margin:10px 0 5px;color:var(--muted);font-size:13px}.session{padding:13px 0;border-bottom:1px solid var(--line)}.session:last-child{border:0}.sessionhead{display:flex;gap:10px;align-items:center}.session input{width:20px;height:20px;accent-color:#65e5a4}.session strong{display:block}.session p{margin:7px 0 0 30px;color:#c4d3e5;line-height:1.45}.bar{height:9px;border-radius:9px;background:#33465c;overflow:hidden;margin:9px 0}.bar>span{display:block;height:100%;background:var(--green)}.weekselect{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.weekselect button{white-space:nowrap;background:#203149;color:white;border:1px solid #40536b;border-radius:10px;padding:10px}.weekselect button.selected{border-color:var(--green);color:var(--green)}.hidden{display:none}.hint{font-size:12px;color:var(--muted);line-height:1.5}.two{display:flex;justify-content:space-between;gap:12px;align-items:center}.empty{color:var(--muted);font-size:13px}canvas{width:100%;height:165px}h2{font-size:19px;margin:12px 0}.foot{font-size:11px;color:#9fb2ca;margin-top:8px}@media(min-width:700px){.metrics{grid-template-columns:repeat(3,1fr)}.tabs{left:50%;transform:translateX(-50%);max-width:850px}}</style></head><body><header><div class="brand">HYROX <span style="color:var(--green)">HQ</span></div><div class="sub">Your training. Your progress. Your race.</div></header><main class="wrap"><section id="dashboard"></section><section id="plan" class="hidden"></section><section id="performance" class="hidden"></section><section id="recovery" class="hidden"></section></main><nav class="tabs"><button class="active" data-tab="dashboard">Dashboard</button><button data-tab="plan">Plan</button><button data-tab="performance">Performance</button><button data-tab="recovery">Recovery</button></nav><script>
const W=[
{n:5,name:'Race-specific running',start:'2026-11-10',end:'2026-11-16',mode:'Together',target:'46–55',sessions:[
['Track — Sprint','2 km warm-up; 5 × 1 km @ 4:15–4:20/km; 90 sec easy jog; 2 km cool-down. Keep every repetition even.',9,'Run'],['Slow recovery','6–7 km @ 5:55–6:20/km. Lower-body REVL, reduce loads if sore.',6.5,'Run'],['Engine + threshold','2 km warm-up; 2 × 12 min @ 4:25–4:35/km; 3 min easy jog; 1–2 km cool-down.',8.5,'Run'],['Slow recovery','5–6 km @ 6:00–6:20/km. Upper-body REVL.',5.5,'Run'],['Rest','Full rest.',0,'Rest'],['HYROX together','5–6 rounds: 1 km @ 4:25–4:30/km + HYROX station. Controlled race-specific effort, not all-out.',5.5,'HYROX'],['Easy aerobic','7–9 km @ 5:30–5:50/km. Moderate full-body REVL.',8,'Run']]},
{n:6,name:'Peak running fitness',start:'2026-11-17',end:'2026-11-23',mode:'Solo',target:'45–55',sessions:[
['Engine + threshold','2 km warm-up; 2 × 15 min @ 4:25–4:35/km; 3 min jog; 1–2 km cool-down. Reduce Engine intensity.',9,'Run'],['Slow recovery','6–7 km @ 6:00–6:20/km. Lower-body REVL.',6.5,'Run'],['Track — Sprint','2 km warm-up; 5 × 1 km @ 4:05–4:10/km; 2 min easy jog; 2 km cool-down. Hard but controlled.',9,'Run'],['Slow recovery','5–6 km @ 6:00–6:20/km. Upper-body REVL.',5.5,'Run'],['Rest','Full rest.',0,'Rest'],['Aerobic endurance','12–14 km @ 5:30–5:50/km. If HYROX instead, reduce running distance.',13,'Run'],['Easy aerobic','7–8 km @ 5:35–5:55/km. Moderate full-body REVL.',7.5,'Run']]},
{n:7,name:'Race rehearsal',start:'2026-11-24',end:'2026-11-30',mode:'Together',target:'35–45',sessions:[
['Track — Sprint','2 km warm-up; 4 × 1 km @ 4:20–4:25/km; 90 sec easy recovery; 1–2 km cool-down. Smooth race rhythm.',7.5,'Run'],['Slow recovery','5–6 km @ 6:00–6:20/km. Lower-body REVL lighter.',5.5,'Run'],['Engine + race rhythm','2 km warm-up; 3 × 6 min @ 4:25–4:30/km; 2 min easy jog; 1 km cool-down. Engine light.',7,'Run'],['Slow recovery','5 km @ 6:00–6:20/km. Upper-body REVL.',5,'Run'],['Rest','Full rest.',0,'Rest'],['HYROX rehearsal','4–6 rounds: 1 km @ 4:25–4:30/km + stations. Practise race communication and transitions. Avoid maximal fatigue.',5,'HYROX'],['Easy aerobic','5–7 km @ 5:35–5:55/km. No heavy deadlifts.',6,'Run']]},
{n:8,name:'Taper',start:'2026-12-01',end:'2026-12-07',mode:'Solo',target:'20–30',sessions:[
['Engine + easy','5–6 km @ 5:40–6:00/km with 4 × 20 sec relaxed strides. Skip hard Engine work.',5.5,'Run'],['Slow recovery','5 km @ 6:00–6:20/km. Skip heavy lower-body REVL.',5,'Run'],['Track — light Sprint','2 km warm-up; 4 × 400 m @ 4:10–4:15/km; 200 m easy jog; 1–2 km cool-down. No hard Sprint class.',5,'Run'],['Slow recovery','4–5 km @ 6:00–6:20/km. Optional light upper-body REVL.',4.5,'Run'],['Rest','Full rest.',0,'Rest'],['Easy run','5–6 km @ 5:40–6:00/km. No HYROX simulation.',5.5,'Run'],['Easy shakeout','3–4 km very easy. Optional 3 × 15 sec relaxed strides. No deadlifts.',3.5,'Run']]}];
const DAYS=['Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday','Monday'];const races=[['Mixed Doubles','2026-12-09','Sub-60'],["Men’s Open",'2026-12-12','Race day']];const KEY='hyrox-hq-v1';let state={done:{},logs:[],checkins:[],selected:5};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const iso=d=>{let x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-AU',{day:'numeric',month:'short'})};const today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const key=(w,i)=>`${w.n}-${i}`;const current=()=>W.find(w=>today()>=w.start&&today()<=w.end)|| (today()<W[0].start?W[0]:W[3]);const next=()=>{for(const w of W)for(let i=0;i<7;i++){let d=addDays(w.start,i);if(d>=today()&&!state.done[key(w,i)]&&w.sessions[i][3]!=='Rest')return {w,i,d,s:w.sessions[i]}}return null};const fmt=v=>v===null||v===undefined?'Awaiting data':v;const metric=(label,value,detail)=>`<div class="card"><div class="eyebrow">${label}</div><div class="number">${value}</div><div class="hint">${detail}</div></div>`;const logsIn=(a,b)=>state.logs.filter(x=>x.date>=a&&x.date<=b);const km=xs=>xs.reduce((n,x)=>n+(+x.km||0),0);const checkin=()=>state.checkins.find(x=>x.date===today());const avg=(field)=>{let vals=state.checkins.slice(-7).map(x=>+x[field]).filter(x=>x>0);return vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(field==='sleep'?1:0):null};const count=w=>w.sessions.reduce((n,s,i)=>n+(state.done[key(w,i)]?1:0),0);function renderDashboard(){let w=current(),n=next(),runs=logsIn(w.start,w.end),total=km(runs).toFixed(1),c=checkin();document.querySelector('#dashboard').innerHTML=`<div class="card"><div class="eyebrow">Current training week</div><div class="big">Week ${w.n} — ${w.name}</div><div class="muted">${iso(w.start)}–${iso(w.end)} · ${w.mode} · ${w.target} km target</div><div class="bar"><span style="width:${count(w)/7*100}%"></span></div><div class="hint">${count(w)} of 7 days marked complete</div></div><div class="card"><div class="two"><div class="eyebrow">Next scheduled run / workout</div><span class="pill">From your plan</span></div>${n?`<div class="big">${n.s[0]}</div><div class="muted">${DAYS[n.i]}, ${iso(n.d)} · Week ${n.w.n}</div><p>${n.s[1]}</p><button class="action" onclick="toggle(${n.w.n},${n.i})">Mark completed</button>`:'<p class="muted">No upcoming sessions remaining in the imported plan.</p>'}</div><div class="metrics">${metric('Weekly running',total+' km','Logged km · Target '+w.target+' km')}${metric('Sessions completed',count(w)+'/7','Marked complete this week')}${metric('Fatigue',c?.fatigue?c.fatigue+'/10':'Awaiting data','Manual daily check-in')}${metric('Sleep',avg('sleep')?avg('sleep')+' h':'Awaiting data','Average of last 7 check-ins')}${metric('Resting HR',avg('rhr')?avg('rhr')+' bpm':'Awaiting data','Average of last 7 check-ins')}${metric('HRV',avg('hrv')?avg('hrv')+' ms':'Awaiting data','Manual entry until Garmin sync')}</div><div class="card"><div class="eyebrow">What to work on</div><div class="big" style="font-size:18px">${w.n===8?'Arrive fresh for race week':w.n===7?'Race rhythm and transitions':w.n===6?'Controlled threshold and speed':'Consistent race-specific running'}</div><p class="muted">${w.n===8?'Reduce fatigue; keep sessions short and easy.':w.n===7?'Practise station transitions and communication without maximal fatigue.':w.n===6?'Hold planned interval paces while protecting recovery.':'Keep repeats even and avoid turning recovery days into hard sessions.'}</p><div class="hint">Plan-based guidance only. Not an AI assessment of Garmin data.</div></div><div class="card"><div class="eyebrow">Upcoming races</div>${races.map(r=>{let d=Math.ceil((new Date(r[1]+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);return `<div class="session two"><div><strong>${r[0]}</strong><div class="hint">${iso(r[1])} · ${r[2]}</div></div><strong>${d>=0?d+' days':'Finished'}</strong></div>`}).join('')}</div><div class="hint">No live Garmin connection yet. Completion checkmarks and check-ins are stored only in this browser on this device.</div>`}
function toggle(n,i){let w=W.find(x=>x.n===n),k=key(w,i);state.done[k]=!state.done[k];save();renderAll()}function renderPlan(){let w=W.find(x=>x.n===state.selected)||current();document.querySelector('#plan').innerHTML=`<h2>Training plan</h2><div class="weekselect">${W.map(x=>`<button class="${w.n===x.n?'selected':''}" onclick="selectWeek(${x.n})">Week ${x.n}</button>`).join('')}</div><div class="card"><div class="eyebrow">${iso(w.start)}–${iso(w.end)} · ${w.mode}</div><div class="big">Week ${w.n} — ${w.name}</div><div class="muted">Running target: ${w.target} km</div>${w.sessions.map((s,i)=>`<div class="session"><div class="sessionhead"><input aria-label="Complete ${DAYS[i]}" type="checkbox" ${state.done[key(w,i)]?'checked':''} onchange="toggle(${w.n},${i})"><div><div class="hint">${DAYS[i]} · ${iso(addDays(w.start,i))}</div><strong>${s[0]}</strong></div></div><p>${s[1]}</p></div>`).join('')}</div>`}function selectWeek(n){state.selected=n;save();renderPlan()}function renderPerformance(){let w=current(),rows=W.map(x=>({w:x,km:km(logsIn(x.start,x.end))}));document.querySelector('#performance').innerHTML=`<h2>Performance</h2><div class="card"><div class="eyebrow">Running volume by week</div>${rows.map(x=>`<div style="margin-top:15px"><div class="two"><span>Week ${x.w.n} · ${x.w.name}</span><strong>${x.km.toFixed(1)} km</strong></div><div class="bar"><span style="width:${Math.min(100,x.km/55*100)}%"></span></div><div class="hint">Target ${x.w.target} km</div></div>`).join('')}<p class="hint">Add completed running distance below. Marking a planned session complete does not invent a distance.</p></div><div class="card"><div class="eyebrow">Log a completed workout</div><label>Date</label><input id="ldate" type="date" value="${today()}"><label>Type</label><select id="ltype"><option>Run</option><option>HYROX</option><option>Strength</option><option>Bike</option><option>Swim</option><option>Other</option></select><label>Distance (km)</label><input id="lkm" type="number" min="0" step="0.1" placeholder="e.g. 8.5"><label>Duration (minutes)</label><input id="lmin" type="number" min="0" step="1" placeholder="Optional"><label>Average heart rate (bpm)</label><input id="lhr" type="number" min="0" step="1" placeholder="Optional"><label>Notes</label><input id="lnotes" placeholder="How did it feel?"><p><button class="action" onclick="addLog()">Save workout</button></p></div><div class="card"><div class="eyebrow">Workout history</div>${state.logs.length?state.logs.slice().reverse().map((l,i)=>`<div class="session two"><div><strong>${l.date} · ${l.type}</strong><div class="hint">${l.km||0} km · ${l.min||'—'} min · ${l.hr||'—'} bpm · ${esc(l.notes||'')}</div></div><button class="secondary" onclick="removeLog(${state.logs.length-1-i})">Delete</button></div>`).join(''):'<p class="empty">No workouts logged yet.</p>'}</div>`}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function addLog(){let l={date:document.querySelector('#ldate').value,type:document.querySelector('#ltype').value,km:document.querySelector('#lkm').value,min:document.querySelector('#lmin').value,hr:document.querySelector('#lhr').value,notes:document.querySelector('#lnotes').value};if(!l.date)return alert('Choose a date');state.logs.push(l);save();renderAll()}function removeLog(i){if(confirm('Delete this workout?')){state.logs.splice(i,1);save();renderAll()}}function renderRecovery(){let c=checkin()||{};document.querySelector('#recovery').innerHTML=`<h2>Recovery</h2><div class="card"><div class="eyebrow">Daily check-in · ${iso(today())}</div><p class="hint">Enter your Garmin readings manually until secure syncing is available. Fatigue is your subjective rating, not a medical score.</p><label>Fatigue (1 = fresh, 10 = exhausted)</label><input id="fatigue" type="number" min="1" max="10" value="${c.fatigue||''}" placeholder="1–10"><label>Sleep last night (hours)</label><input id="sleep" type="number" min="0" max="24" step="0.1" value="${c.sleep||''}" placeholder="e.g. 7.5"><label>Resting heart rate (bpm)</label><input id="rhr" type="number" min="20" max="150" value="${c.rhr||''}" placeholder="e.g. 42"><label>HRV (ms)</label><input id="hrv" type="number" min="1" max="300" value="${c.hrv||''}" placeholder="Optional"><p><button class="action" onclick="saveCheckin()">Save check-in</button></p></div><div class="card"><div class="eyebrow">7 latest check-ins</div>${state.checkins.length?state.checkins.slice(-7).reverse().map(x=>`<div class="session"><strong>${x.date}</strong><div class="hint">Fatigue ${x.fatigue||'—'}/10 · Sleep ${x.sleep||'—'}h · Resting HR ${x.rhr||'—'} · HRV ${x.hrv||'—'}</div></div>`).join(''):'<p class="empty">No recovery entries yet.</p>'}</div><div class="card"><div class="eyebrow">Data and privacy</div><p class="hint">This app is currently static. It does not call Garmin or send your data to a server. Data entered here is saved in local browser storage; clearing browser data or using a different device may remove it. Export a backup regularly.</p><button class="secondary" onclick="exportData()">Export my data (JSON)</button></div>`}function saveCheckin(){let x={date:today(),fatigue:document.querySelector('#fatigue').value,sleep:document.querySelector('#sleep').value,rhr:document.querySelector('#rhr').value,hrv:document.querySelector('#hrv').value};if(x.fatigue&&(+x.fatigue<1||+x.fatigue>10))return alert('Fatigue must be 1–10');state.checkins=state.checkins.filter(a=>a.date!==x.date);state.checkins.push(x);state.checkins.sort((a,b)=>a.date.localeCompare(b.date));save();renderAll()}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='hyrox-training-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function renderAll(){renderDashboard();renderPlan();renderPerformance();renderRecovery()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab))});renderAll();</script></body></html>
