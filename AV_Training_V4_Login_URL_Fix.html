async function testSupabase(){
 const el=document.getElementById('sbDiagnostic');
 const url=document.getElementById('sbUrl').value.trim().replace(/\/$/,'');
 const key=document.getElementById('sbAnon').value.trim();
 if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){el.textContent='Invalid URL format. Copy the project URL, not the /rest/v1/ endpoint.';return;}
 el.textContent='Testing '+url+' …';
 try{
   const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key},cache:'no-store'});
   const body=await r.text();
   if(r.ok){el.textContent='Connection successful (HTTP '+r.status+'). You can now create an account.';}
   else {el.textContent='Server reached (HTTP '+r.status+'). Check that the publishable key belongs to this exact project. '+body.slice(0,140);}
 }catch(e){el.textContent='Cannot reach '+url+' — '+e.message+'. Check the exact hostname in Supabase and whether your network or DNS blocks it.';}
}

function suggestMatches(){let ignored=state.matches||{};let out=[];for(let a of activities()){let ds=String(a.date).slice(0,10);for(let w of workouts()){if(w.date!==ds||w.matchId||w.status==='skipped'||ignored[w.id+'|'+a.id])continue;let compatible=isRun(a)?['Running','HYROX'].includes(w.sport):/strength/i.test(a.type)?['Strength','HYROX'].includes(w.sport):String(a.type).toLowerCase().includes(w.sport.toLowerCase());if(compatible&&!state.workouts.some(x=>String(x.matchId)===String(a.id)))out.push({w,a})}}return out}

function mergeGarminPayload(data){if(!Array.isArray(data.activities))throw Error('Unexpected activity response');let old=new Map(state.activities.map(a=>[String(a.id),a]));for(let a of data.activities){if(!a.id||!/^[a-zA-Z0-9_-]+$/.test(String(a.id)))continue;let d=typeof a.date==='string'?a.date:(a.date?new Date(a.date).toISOString():'');if(d.slice(0,10)<START)continue;old.set(String(a.id),{...a,date:d})}state.activities=[...old.values()];let raw=Array.isArray(data.recovery)?data.recovery:Array.isArray(data.recoveryDays)?data.recoveryDays:Array.isArray(data.dailyRecovery)?data.dailyRecovery:Array.isArray(data.wellness)?data.wellness:[];if(raw.length){let days=new Map(recoveryRecords().map(r=>[String(r.date||r.day||r.calendarDate).slice(0,10),r]));for(let r of raw){let d=String(r.date||r.day||r.calendarDate||'').slice(0,10);if(/^\d{4}-\d{2}-\d{2}$/.test(d))days.set(d,{...days.get(d),...r,date:d})}state.recoveryDays=[...days.values()].sort((a,b)=>String(a.date).localeCompare(String(b.date)))}state.settings.lastGarminSync=new Date().toISOString()}
async function fetchGarmin(){let key=document.getElementById('garminKey')?.value.trim()||state.settings.garminKey;if(!key)return notice('Enter dashboard read key in Settings');state.settings.garminKey=key;localStorage.setItem('av-training-v2',JSON.stringify(state));notice('Refreshing Garmin data…');try{let r=await fetch(GARMIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});let data=await r.json();if(!r.ok||data.error)throw Error(data.error||'HTTP '+r.status);mergeGarminPayload(data);save();notice('Garmin synced: '+data.activities.length+' activities, '+recoveryRecords().length+' recovery days')}catch(e){notice('Garmin connection failed: '+e.message)}}

async function cloudSave(retry=true){if(!token||!userId)return;let r=await fetch(state.settings.supabaseUrl+'/rest/v1/av_training_data?on_conflict=user_id',{method:'POST',headers:{...sbHeaders(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:userId,training_data:cloudPayload(),updated_at:new Date().toISOString()})});if(r.status===401&&retry&&await refreshSession())return cloudSave(false);if(!r.ok)throw Error('HTTP '+r.status+' '+(await r.text()).slice(0,100))}
async function cloudLoad(retry=true){let r=await fetch(state.settings.supabaseUrl+'/rest/v1/av_training_data?user_id=eq.'+encodeURIComponent(userId)+'&select=training_data',{headers:sbHeaders()});if(r.status===401&&retry&&await refreshSession())return cloudLoad(false);if(!r.ok)throw Error('Cloud read HTTP '+r.status);let rows=await r.json();if(rows.length&&rows[0].training_data){let settings=state.settings,localRecoverySnapshot=recoveryRecords();state=rows[0].training_data;if(!Array.isArray(state.recoveryDays)||!state.recoveryDays.length)state.recoveryDays=localRecoverySnapshot;state.settings={...settings,...state.settings,garminKey:settings.garminKey};for(let k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];localStorage.setItem('av-training-v2',JSON.stringify(state));render()}else await cloudSave()}

let authRefreshBusy=null;
async function refreshSession(){let rt=sessionStorage.getItem('av-refresh');if(!rt||!sbConfig())return false;if(authRefreshBusy)return authRefreshBusy;authRefreshBusy=(async()=>{try{let r=await fetch(state.settings.supabaseUrl+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:state.settings.supabaseAnon,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:rt})});if(!r.ok)throw Error('Session expired');let d=await r.json();token=d.access_token;userId=d.user?.id||userId;sessionStorage.setItem('av-token',token);sessionStorage.setItem('av-user',userId);if(d.refresh_token)sessionStorage.setItem('av-refresh',d.refresh_token);render();return true}catch(e){token='';userId='';sessionStorage.removeItem('av-token');sessionStorage.removeItem('av-user');sessionStorage.removeItem('av-refresh');render();notice('Session expired. Please sign in again.');return false}finally{authRefreshBusy=null}})();return authRefreshBusy}
async function auth(action){const emailInput=document.getElementById('sbEmail')?.value.trim(),passwordInput=document.getElementById('sbPass')?.value;const cloudUrl=document.getElementById('sbUrl')?.value.trim().replace(/\/$/,''),cloudAnon=document.getElementById('sbAnon')?.value.trim();state.settings.supabaseUrl=cloudUrl;state.settings.supabaseAnon=cloudAnon;localStorage.setItem('av-training-v2',JSON.stringify(state));if(!sbConfig())return notice('Configure Supabase URL and publishable key first');if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(cloudUrl))return notice('Invalid Supabase URL. Check project hostname.');let email=emailInput,password=passwordInput;if(!email||!password)return notice('Enter email and password');try{let r=await fetch(state.settings.supabaseUrl+'/auth/v1/'+action,{method:'POST',headers:{'apikey':state.settings.supabaseAnon,'Content-Type':'application/json'},body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)throw Error(d.msg||d.error_description||d.message||'Authentication failed');if(!d.access_token){notice('Account created. Confirm email, then sign in.');return}token=d.access_token;userId=d.user.id;sessionStorage.setItem('av-token',token);sessionStorage.setItem('av-user',userId);if(d.refresh_token)sessionStorage.setItem('av-refresh',d.refresh_token);await cloudLoad();render();notice('Signed in; cloud data ready')}catch(e){notice(e.message)}}

async function v4Authenticate(){let email=document.getElementById('v4Email')?.value.trim(),password=document.getElementById('v4Password')?.value,invite=document.getElementById('v4Invite')?.value.trim();if(!email||!password)return v4SetError('Enter your email and password.');if(v4Mode==='register'&&!invite)return v4SetError('Enter your invitation code.');v4SetError('Please wait…');try{

 if(v4Mode==='register')sessionStorage.setItem(v4PendingKey,invite.toUpperCase());
 if(!d.access_token){v4Show('login');v4SetError('Account created. Confirm your email if required, then sign in on this device.');return}

async function v4Join(){let code=document.getElementById('v4Invite')?.value.trim();if(!code)return v4SetError('Enter an invitation code.');v4SetError('Checking code…');try{let r=await fetch(state.settings.supabaseUrl+'/rest/v1/rpc/av_join',{method:'POST',headers:sbHeaders(),body:JSON.stringify({invite_code:code})});if(!r.ok){let d=await r.json();throw Error(d.message||'Invitation failed')}sessionStorage.removeItem(v4PendingKey);await v4AfterLogin()}catch(e){v4SetError(e.message)}}
async function v4AfterLogin(){try{
 let r=await fetch(state.settings.supabaseUrl+'/rest/v1/av_members?user_id=eq.'+encodeURIComponent(userId)+'&select=user_id',{headers:sbHeaders()});if(!r.ok)throw Error('Could not check account membership: '+r.status);
 let rows=await r.json();if(!rows.length){let pending=sessionStorage.getItem(v4PendingKey);v4Show('invite');if(pending){document.getElementById('v4Invite').value=pending;await v4Join()}return}
 v4Member=true;
 let stored=localStorage.getItem(v4LocalKey(userId));
 // Preserve owner's legacy local state only when its existing cloud record exists.
 let cloud=await fetch(state.settings.supabaseUrl+'/rest/v1/av_training_data?user_id=eq.'+encodeURIComponent(userId)+'&select=training_data',{headers:sbHeaders()});if(!cloud.ok)throw Error('Cloud load failed: '+cloud.status);
 let records=await cloud.json();
 let settings=state.settings;
 if(records.length&&records[0].training_data){state=records[0].training_data;state.settings={...settings,...state.settings,garminKey:JSON.parse(stored||'null')?.settings?.garminKey||''}}
 else if(stored){state=JSON.parse(stored);state.settings={...settings,...state.settings}}
 else {state=seed();state.workouts=[];state.goals=[];state.activities=[];state.recoveryDays=[];state.checkins={};state.matches={};state.settings={...state.settings,supabaseUrl:settings.supabaseUrl,supabaseAnon:settings.supabaseAnon,garminKey:''}}
 for(let k of Object.keys(defaults))if(state[k]===undefined)state[k]=defaults[k];
 localStorage.setItem(v4LocalKey(userId),JSON.stringify(state));
 v4Ready=true;document.getElementById('v4Gate').classList.add('hidden');render();
 if(!records.length)await cloudSave();
 if(!state.settings.garminKey)v4Show('connect');else fetchGarmin().catch(()=>{});
 }catch(e){v4Show('login');v4SetError(e.message)}}
async function v4Connect(){let key=document.getElementById('v4Garmin')?.value.trim();if(!key)return v4SetError('Enter a dashboard read key or skip.');v4SetError('Testing connection…');try{let r=await fetch(GARMIN_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});let data=await r.json();if(!r.ok||data.error||!Array.isArray(data.activities))throw Error(data.error||'Invalid Garmin response');state.settings.garminKey=key;mergeGarminPayload(data);save();document.getElementById('v4Gate').classList.add('hidden');notice('Garmin connected successfully')}catch(e){v4SetError('Connection failed: '+e.message)}}
function v4SkipGarmin(){document.getElementById('v4Gate').classList.add('hidden');render()}
function v4Logout(){token='';userId='';v4Ready=false;v4Member=false;sessionStorage.removeItem('av-token');sessionStorage.removeItem('av-user');sessionStorage.removeItem('av-refresh');state=seed();state.workouts=[];state.activities=[];state.goals=[];v4Show('login')}
const v4OriginalRender=render;
render=function(){if(!v4Ready){document.querySelector('.shell').style.display='none';return}document.querySelector('.shell').style.display='';v4OriginalRender();let header=document.querySelector('.top .row');if(header&&!document.getElementById('v4SignOut'))header.insertAdjacentHTML('beforeend','<button id="v4SignOut" class="btn alt sm" onclick="v4Logout()">Sign out</button>')};
const v4OriginalSave=save;
save=function(){if(!v4Ready||!userId)return;localStorage.setItem(v4LocalKey(userId),JSON.stringify(state));v4OriginalSave()};
// V3 save still writes legacy local key, but only while signed in; never load it for a new user.
const v4OriginalCloudLoad=cloudLoad;
cloudLoad=async function(){if(!v4Ready)return;return v4OriginalCloudLoad()};
// Do not allow old settings auth controls to bypass V4's invitation workflow.
auth=async()=>{v4Show('login')};signOut=v4Logout;signIn=()=>v4Show('login');signUp=()=>v4Show('register');
// On startup, refresh session before showing the user's data.
(async()=>{v4Show('login');if(token&&sessionStorage.getItem('av-refresh')){try{let ok=await refreshSession();if(ok)await v4AfterLogin()}catch(e){v4Show('login')}}})();
</script></body></html>
